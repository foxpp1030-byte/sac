<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예술의전당</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/gnb.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script defer src="./js/main.js"></script>
</head>

<body>
    <div id="wrap">
        <header id="header">
            <div class="header_inner">
                <h1 class="logo">
                    <a href="#">
                        <img src="./img/img.png" alt="예술의전당 로고" />
                    </a>
                </h1>
                <nav class="gnb">
                    <ul class="gnb_list">
                        <li class="gnb_item">
                            <a href="#" class="gnb_link">공연/전시</a>
                            <ul class="sub_list">
                                <li><a href="#">공연</a></li>
                                <li><a href="#">전시</a></li>
                                <li><a href="#">문화행사</a></li>
                            </ul>
                        </li>
                        <li class="gnb_item">
                            <a href="#" class="gnb_link">아카데미</a>
                            <ul class="sub_list">
                                <li><a href="#">아카데미 소개</a></li>
                                <li><a href="#">강좌 신청</a></li>
                                <li><a href="#">음악영재교육</a></li>
                            </ul>
                        </li>
                        <li class="gnb_item">
                            <a href="#" class="gnb_link">방문/이용</a>
                            <ul class="sub_list">
                                <li><a href="#">오시는 길</a></li>
                                <li><a href="#">주차 안내</a></li>
                                <li><a href="#">편의시설</a></li>
                            </ul>
                        </li>
                        <li class="gnb_item">
                            <a href="#" class="gnb_link">대관안내</a>
                            <ul class="sub_list">
                                <li><a href="#">대관 시설</a></li>
                                <li><a href="#">대관 절차</a></li>
                                <li><a href="#">대관 문의</a></li>
                            </ul>
                        </li>
                    </ul>
                </nav>
                <div class="util_menu">
                    <button class="util_btn search_btn" id="search_open" aria_label="검색">
                        <img src="./img/search0.svg" alt="검색 아이콘" />
                    </button>
                    <button class="util_btn calendar_btn" aria_label="캘린더">
                        <img src="./img/calendar0.svg" alt="캘린더 아이콘" />
                    </button>
                    <button class="util_btn user_btn" aria_label="마이페이지">
                        <img src="./img/user0.svg" alt="사용자 아이콘" />
                    </button>
                    <button class="util_btn menu_btn" id="menu_toggle" aria_label="전체 메뉴">
                        <img src="./img/menu0.svg" alt="전체 메뉴 아이콘" />
                    </button>
                </div>
            </div>
        </header>

        <main id="container">
            <section class="main_visual">
            </section>

        </main>

        <footer id="footer">
        </footer>

    </div>
</body>

</html>
